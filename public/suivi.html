<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Suivi de convoi</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root{
    --bg:#14161a; --panel:#1d2026; --panel-2:#252932; --line:#31353f;
    --text:#edeff2; --text-dim:#9aa1ac; --amber:#f5b301; --teal:#5ec8d8;
    --green:#4cc38a; --red:#ef5b5b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);display:inline-block}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:13px;letter-spacing:.5px}
  .grow{flex:1}
  .status{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--text-dim);display:inline-block}
  .status.online i{background:var(--green)}
  .status.connecting i{background:var(--amber)}
  a.btn,button{font:inherit;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;text-decoration:none;display:inline-block}
  a.btn:hover,button:hover{border-color:var(--amber)}
  .hint{display:none;background:#33260a;border-bottom:1px solid var(--amber);color:#ffd36a;padding:9px 14px;font-size:13px;line-height:1.45;flex-shrink:0}
  main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0;background:#0e1013}
  aside{width:320px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;flex-shrink:0}
  .veh{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
  .veh:hover{background:var(--panel-2)}
  .veh.stale{opacity:.5}
  .badge{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;color:#14161a;font-size:13px}
  .veh b{display:block;font-size:14px}
  .veh small{display:block;color:var(--text-dim);font-size:12px}
  .veh .toll{color:var(--amber)}
  .empty{padding:22px 16px;color:var(--text-dim);text-align:center}
  /* liste des convois */
  #convoys{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
  #convoys h2{margin:4px 0 12px;font-size:17px}
  .crow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;color:var(--text);text-decoration:none}
  .crow:hover{border-color:var(--amber)}
  .crow .code{font-size:15px}
  .crow small{color:var(--text-dim)}
  .crow .go{margin-left:auto;color:var(--amber);font-weight:700}
  /* marqueurs */
  .vmark{position:relative}
  .vmark .bub{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-weight:800;color:#14161a;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .vmark .arrow{position:absolute;left:50%;top:50%;width:0;height:0;margin:-24px 0 0 -6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--c);transform-origin:6px 24px}
  .vmark .lbl{position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(20,22,26,.88);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
  .vmark.stale .bub{filter:grayscale(1);opacity:.6}
  @media (max-width:720px){
    main{flex-direction:column}
    aside{width:100%;max-width:none;height:38%;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Suivi de convoi</h1>
  <span class="code" id="code-label" style="display:none;">—</span>
  <span class="grow"></span>
  <span class="status" id="status"><i></i><span id="status-text">Connexion…</span></span>
  <button id="fit-btn" type="button" style="display:none;">🎯 Tout voir</button>
  <a class="btn" id="back-btn" href="/" style="display:none;">← Tous les convois</a>
</header>
<div id="hint" class="hint"></div>

<div id="convoys" style="display:none;">
  <h2>Convois actifs</h2>
  <div id="convoy-list"><div class="empty">Chargement…</div></div>
</div>

<main id="map-view" style="display:none;">
  <div id="map"></div>
  <aside id="list"><div class="empty">En attente des véhicules…</div></aside>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const STALE_MS = 2 * 60 * 1000;     // grisé après 2 min sans nouvelle
  let skew = 0;                        // décalage entre l'horloge du serveur et celle de ce poste
  const now = () => Date.now() + skew;
  function sync(t){ if (typeof t === 'number') skew = t - Date.now(); }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function colorFor(id){
    let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return 'hsl(' + (h % 360) + ',78%,62%)';
  }
  function ago(ts){
    const s = Math.max(0, Math.round((now() - ts) / 1000));
    if (s < 5) return 'à l’instant';
    if (s < 60) return 'il y a ' + s + ' s';
    if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
    return 'il y a ' + Math.round(s / 3600) + ' h';
  }
  function fmtEta(min){
    if (min == null) return '';
    const h = Math.floor(min / 60), m = Math.round(min % 60);
    return h ? h + ' h ' + String(m).padStart(2, '0') : m + ' min';
  }

  // ---- statut + message d'aide si la connexion tarde ----
  let online = false, offlineSince = Date.now();
  function setStatus(s){
    online = (s === 'online');
    if (online){ $('hint').style.display = 'none'; offlineSince = 0; }
    else if (!offlineSince) offlineSince = Date.now();
    $('status').className = 'status ' + (s === 'online' ? 'online' : 'connecting');
    $('status-text').textContent = s === 'online' ? 'En direct' : 'Reconnexion…';
  }
  setInterval(() => {
    if (online || !offlineSince || Date.now() - offlineSince < 12000) return;
    const h = $('hint');
    h.style.display = 'block';
    h.textContent = 'Connexion au serveur de suivi perdue. Vérifie ton accès réseau ; la page se reconnecte automatiquement.';
  }, 3000);

  const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  // =====================================================================
  //  Vue « liste des convois »
  // =====================================================================
  if (!code){
    $('convoys').style.display = '';
    async function loadList(){
      try {
        const r = await fetch('/api/convoys', { cache: 'no-store', credentials: 'same-origin' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        sync(d.t); setStatus('online');
        if (!d.convoys.length){
          $('convoy-list').innerHTML = '<div class="empty">Aucun convoi actif pour le moment.<br><small>Un convoi apparaît dès qu’un conducteur démarre son trajet avec le partage activé.</small></div>';
          return;
        }
        $('convoy-list').innerHTML = d.convoys.map(c =>
          '<a class="crow" href="/?c=' + encodeURIComponent(c.code) + '"><span class="code">' + esc(c.code) + '</span>' +
          '<span>' + c.vehicles + ' véhicule' + (c.vehicles > 1 ? 's' : '') + '<br><small>' + ago(c.last) + '</small></span>' +
          '<span class="go">Ouvrir la carte →</span></a>').join('');
      } catch (e) { setStatus('offline'); }
    }
    loadList();
    setInterval(loadList, 5000);
    return;
  }

  // =====================================================================
  //  Vue « carte d'un convoi »
  // =====================================================================
  $('map-view').style.display = '';
  $('code-label').style.display = '';
  $('code-label').textContent = code;
  $('fit-btn').style.display = '';
  $('back-btn').style.display = '';
  document.title = 'Convoi ' + code;

  const map = L.map('map', { zoomControl: true }).setView([46.6, 2.4], 6);
  L.tileLayer('/tiles/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

  const vehicles = new Map(); // id -> {id, data, marker, routeLine}
  let userMoved = false;
  map.on('dragstart zoomstart', (e) => { if (e && e.originalEvent) userMoved = true; });

  function markerHtml(v){
    const c = colorFor(v.id);
    const init = esc((v.data.name || '?').trim().slice(0, 2).toUpperCase());
    const rot = (typeof v.data.heading === 'number') ? v.data.heading : null;
    return '<div class="vmark" style="--c:' + c + '">' +
      (rot !== null ? '<div class="arrow" style="transform:rotate(' + rot + 'deg)"></div>' : '') +
      '<div class="bub" style="background:' + c + '">' + init + '</div>' +
      '<div class="lbl">' + esc(v.data.name || 'Véhicule') + '</div></div>';
  }
  function entry(id){
    let v = vehicles.get(id);
    if (!v){ v = { id: id, data: null, marker: null, routeLine: null }; vehicles.set(id, v); }
    return v;
  }
  function upsert(id, data){
    const v = entry(id);
    v.data = data;
    const icon = L.divIcon({ className: '', html: markerHtml(v), iconSize: [34, 34], iconAnchor: [17, 17] });
    const ll = [data.lat, data.lon];
    if (!v.marker){
      v.marker = L.marker(ll, { icon: icon, zIndexOffset: 500 }).addTo(map);
      v.marker.on('click', () => map.setView(v.marker.getLatLng(), Math.max(map.getZoom(), 12)));
    } else { v.marker.setLatLng(ll); v.marker.setIcon(icon); }
  }
  function setRoute(id, r){
    const v = entry(id);
    if (v.routeLine){ map.removeLayer(v.routeLine); v.routeLine = null; }
    if (Array.isArray(r) && r.length > 1){
      v.routeLine = L.polyline(r, { color: colorFor(id), weight: 4, opacity: .55, dashArray: '2 8' }).addTo(map);
    }
  }
  function remove(id){
    const v = vehicles.get(id);
    if (!v) return;
    if (v.marker) map.removeLayer(v.marker);
    if (v.routeLine) map.removeLayer(v.routeLine);
    vehicles.delete(id);
  }
  function fitAll(){
    const pts = [];
    vehicles.forEach(v => { if (v.marker) pts.push(v.marker.getLatLng()); });
    if (!pts.length) return;
    if (pts.length === 1) map.setView(pts[0], 12);
    else map.fitBounds(L.latLngBounds(pts).pad(0.25));
  }
  $('fit-btn').addEventListener('click', () => { userMoved = false; fitAll(); });

  function renderList(){
    const rows = [];
    vehicles.forEach(v => { if (v.data) rows.push(v); });
    rows.sort((a, b) => (a.data.name || '').localeCompare(b.data.name || ''));
    if (!rows.length){
      $('list').innerHTML = '<div class="empty">En attente des véhicules…<br><small>Les positions apparaissent dès qu’un conducteur démarre son trajet avec le partage activé.</small></div>';
      return;
    }
    $('list').innerHTML = rows.map(v => {
      const d = v.data;
      const stale = now() - d.ts > STALE_MS;
      const bits = [];
      if (d.dest) bits.push('→ ' + esc(d.dest));
      if (d.remKm != null) bits.push(Math.round(d.remKm) + ' km restants' + (d.etaMin != null ? ' · ' + fmtEta(d.etaMin) : ''));
      if (typeof d.speed === 'number') bits.push(Math.round(d.speed * 3.6) + ' km/h');
      return '<div class="veh' + (stale ? ' stale' : '') + '" data-id="' + esc(v.id) + '">' +
        '<div class="badge" style="background:' + colorFor(v.id) + '">' + esc((d.name || '?').trim().slice(0, 2).toUpperCase()) + '</div>' +
        '<div><b>' + esc(d.name || 'Véhicule') + '</b>' +
        (bits.length ? '<small>' + bits.join(' · ') + '</small>' : '') +
        (d.nextToll ? '<small class="toll">🚧 ' + esc(d.nextToll) + (d.nextTollKm != null ? ' · dans ' + Math.round(d.nextTollKm) + ' km' : '') + '</small>' : '') +
        '<small>' + (stale ? '⚠️ ' : '') + ago(d.ts) + '</small></div></div>';
    }).join('');
    $('list').querySelectorAll('.veh').forEach(el => el.addEventListener('click', () => {
      const v = vehicles.get(el.dataset.id);
      if (v && v.marker){ userMoved = true; map.setView(v.marker.getLatLng(), Math.max(map.getZoom(), 12)); }
    }));
  }
  function refresh(){
    vehicles.forEach(v => {
      if (v.marker && v.data){
        const el = v.marker.getElement();
        const m = el && el.querySelector('.vmark');
        if (m) m.classList.toggle('stale', now() - v.data.ts > STALE_MS);
      }
    });
    renderList();
  }
  setInterval(refresh, 5000);

  // ---- flux en direct (Server-Sent Events, reconnexion automatique) ----
  let firstFit = false;
  function autoFollow(d){
    if (userMoved) return;
    if (!firstFit || vehicles.size > 1){ fitAll(); firstFit = true; }
    else map.panTo([d.lat, d.lon]);
  }
  const es = new EventSource('/api/stream/' + encodeURIComponent(code));
  es.onopen = () => setStatus('online');
  es.onerror = () => setStatus('offline');
  es.addEventListener('snapshot', (ev) => {
    const d = JSON.parse(ev.data); sync(d.t); setStatus('online');
    const keep = new Set(d.vehicles.map(v => v.id));
    Array.from(vehicles.keys()).forEach(id => { if (!keep.has(id)) remove(id); });
    d.vehicles.forEach(v => { upsert(v.id, v.pos); setRoute(v.id, v.route); });
    renderList();
    if (!userMoved) { fitAll(); firstFit = vehicles.size > 0; }
  });
  es.addEventListener('pos', (ev) => {
    const d = JSON.parse(ev.data); sync(d.t);
    upsert(d.id, d.pos); renderList(); autoFollow(d.pos);
  });
  es.addEventListener('route', (ev) => { const d = JSON.parse(ev.data); sync(d.t); setRoute(d.id, d.route); });
  es.addEventListener('remove', (ev) => { const d = JSON.parse(ev.data); sync(d.t); remove(d.id); renderList(); });
})();
</script>
</body>
</html>
